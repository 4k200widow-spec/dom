<style>
:root{
  --bg:#111214;--surface:#1A1B1F;--surface2:#23252A;--line:#2D3036;--text:#EDEDEA;--muted:#9AA0A8;
  --accent:#8DB6E8;--accent-text:#8DB6E8;--onaccent:#0F1724;--accent-s:rgba(141,182,232,.16);
  --neg:#F28B82;--neg-s:rgba(242,139,130,.14);--warn:#E6B866;--warn-s:rgba(230,184,102,.14);--ok:#7DCFA6;--ok-s:rgba(125,207,166,.14);
  --shade:rgba(0,0,0,.55);--r-lg:24px;--r-md:18px;--r-sm:13px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-text-size-adjust:100%;font-feature-settings:"tnum" 1}
body{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-text)}
svg{display:block}
.wrap{max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 18px calc(112px + env(safe-area-inset-bottom))}
.cap{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:8px 0 22px}
h1{margin:4px 0 0;font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
h2{margin:4px 0 0;font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.sub{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.35}
.label{margin:28px 2px 10px;display:flex;justify-content:space-between;align-items:baseline}
.label.neg .cap{color:var(--neg)}
.card{background:var(--surface);border-radius:var(--r-md);border:1px solid var(--line)}
.list{padding:0 14px}
.list>*+*{border-top:1px solid var(--line)}
.iconbtn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;color:var(--text)}
.tile{width:40px;height:40px;border-radius:12px;background:var(--surface2);color:var(--muted);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tile.acc{background:var(--accent-s);color:var(--accent-text)}
.tile.neg{background:var(--neg-s);color:var(--neg)}
/* hero */
.hero{border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);padding:20px 18px 16px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(closest-side,var(--accent-s),transparent);pointer-events:none}
.hero-n{display:flex;align-items:flex-end;gap:14px}
.hero-n b{font-size:64px;font-weight:700;line-height:.9;letter-spacing:-.04em;color:var(--accent-text)}
.hero-n .t{font-size:17px;font-weight:600;padding-bottom:4px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:18px}
.day{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0 9px;border-radius:12px}
.day .w{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.day .n{font-size:16px;font-weight:600}
.day .dots{display:flex;gap:3px;height:5px}
.day .dots i{width:5px;height:5px;border-radius:3px;background:var(--accent)}
.day .dots i.neg{background:var(--neg)}
.day.now{background:var(--accent-s)}
.day.now .n,.day.now .w{color:var(--accent-text)}
/* items */
.it{display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:8px}
.it .main{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;display:flex;gap:12px;align-items:center}
.ttl{font-size:15px;font-weight:600;line-height:1.3}
.pill{display:inline-flex;align-items:center;margin-top:6px;font-size:12px;font-weight:600;border-radius:8px;padding:3px 8px;line-height:1.3}
.p-neg{color:var(--neg);background:var(--neg-s)}.p-warn{color:var(--warn);background:var(--warn-s)}.p-ok{color:var(--ok);background:var(--ok-s)}
.p-acc{color:var(--accent-text);background:var(--accent-s)}.p-mut{color:var(--muted);background:var(--surface2)}
.ring{width:48px;height:48px;border-radius:24px;border:0;background:none;padding:0;position:relative;flex-shrink:0;color:var(--muted)}
.ring>svg{position:absolute;inset:0}
.ring .ck{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.ring:active{transform:scale(.94)}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:9px 0;background:none;border:0;text-align:left}
.row .grow{flex:1;min-width:0}
.row .nm{font-size:15px;line-height:1.3}
.rt{font-size:13px;font-weight:600;white-space:nowrap;color:var(--muted)}
.rt.neg{color:var(--neg)}
.date{width:56px;flex-shrink:0;text-align:center}
.date b{display:block;font-size:19px;font-weight:700;line-height:1.1}
.date span{font-size:12px;color:var(--muted);white-space:nowrap}
.date.now b,.date.now span{color:var(--accent-text)}
.date.late b,.date.late span{color:var(--neg)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -18px;padding:0 18px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:38px;flex-shrink:0;border-radius:19px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:14px;color:var(--text)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--onaccent);font-weight:600}
.select{height:40px;border:1px solid var(--line);border-radius:20px;background:var(--surface);padding:0 12px;font-size:14px;max-width:160px;color:var(--text)}
/* sections */
.sec{margin-bottom:12px;overflow:hidden}
.sec-h{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:14px;background:none;border:0;text-align:left}
.sec-h .ttl{font-size:18px}
.grp-h{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 14px;background:none;border:0;border-top:1px solid var(--line);text-align:left}
.grp-h .cnt{font-size:13px;color:var(--muted);min-width:18px;text-align:right}
.grp-items{padding:0 14px 6px 66px}
.grp-items .row{min-height:48px;padding:8px 0;border-top:1px solid var(--line)}
.chev{color:var(--muted);transition:transform .2s}
.open>.chev,[aria-expanded="true"]>.chev{transform:rotate(180deg)}
/* buttons */
.btn{height:50px;border-radius:14px;border:0;background:var(--accent);color:var(--onaccent);font-weight:600;font-size:16px;padding:0 18px;width:100%}
.btn.sec{background:var(--surface2);color:var(--text)}
.btn.ghost{background:none;color:var(--muted)}
.btn.dash{background:none;border:1px dashed var(--line);color:var(--accent-text)}
.btn:disabled{opacity:.55}
.btns{display:grid;gap:8px;margin-top:14px}
.btns.two{grid-template-columns:1fr 1fr}
.empty{padding:36px 20px;text-align:center;color:var(--muted);font-size:15px;line-height:1.5}
/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);
  background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line)}
.tab{height:52px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:10.5px;padding:0;letter-spacing:.01em}
.tab.on{color:var(--accent-text);font-weight:600}
/* sheet */
.ov{position:fixed;inset:0;background:var(--shade);display:flex;align-items:flex-end;justify-content:center;z-index:10;opacity:0;transition:opacity .2s ease-out}
.ov.show{opacity:1}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:10px 18px calc(26px + env(safe-area-inset-bottom));
  transform:translateY(40px);transition:transform .24s cubic-bezier(.2,.8,.2,1);border-top:1px solid var(--line)}
.ov.show .sheet{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.x{width:40px;height:40px;border:0;background:var(--surface2);border-radius:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;color:var(--text)}
.kv{display:flex;justify-content:space-between;gap:16px;padding:13px 0;font-size:15px}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{text-align:right;overflow-wrap:anywhere}
.note{font-size:14px;line-height:1.5;color:var(--muted);background:var(--surface2);border-radius:var(--r-sm);padding:12px 14px;margin-top:12px}
.f{display:block;margin-top:14px}
.f>span{display:block;margin-bottom:7px}
.f input,.f select,.f textarea{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;padding:0 13px;background:var(--surface2);font-size:16px;color:var(--text)}
.f textarea{height:90px;padding:12px 13px;resize:vertical}
.f input[type=range]{height:30px;border:0;background:none;padding:0;accent-color:var(--accent)}
.f input::placeholder,.f textarea::placeholder{color:var(--muted);opacity:.8}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.pair{display:grid;grid-template-columns:1fr 112px;gap:8px}
.hint{font-size:12px;color:var(--muted);margin-top:5px}
.types{display:flex;flex-wrap:wrap;gap:6px}
.desc{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.45}
.log{padding:13px 0}
.log .top{display:flex;justify-content:space-between;gap:12px}
.files{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;font-size:13px}
.themes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.theme{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);padding:12px;text-align:left;display:flex;gap:10px;align-items:center;min-height:56px}
.theme.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.sw{width:30px;height:30px;border-radius:15px;flex-shrink:0;border:1px solid rgba(128,128,128,.35);position:relative;overflow:hidden}
.sw i{position:absolute;right:0;bottom:0;width:15px;height:15px}
.icons{display:flex;gap:12px}
.icopt{border:2px solid transparent;border-radius:16px;padding:2px;background:none}
.icopt.on{border-color:var(--accent)}
.crop{width:240px;height:240px;border-radius:52px;display:block;margin:4px auto 0;touch-action:none;box-shadow:0 0 0 1px var(--line);background:var(--surface2)}
.icopt.add{width:60px;height:60px;border:1px dashed var(--line);border-radius:15px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.icopt img{width:56px;height:56px;border-radius:13px;display:block;box-shadow:0 0 0 1px var(--line)}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);border-radius:14px;padding:12px 16px;font-size:14px;font-weight:500;z-index:20;max-width:90vw;transition:opacity .2s}
.login{max-width:420px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 22px 40px}
.logo{width:72px;height:72px;border-radius:18px;margin-bottom:22px}
.sync{display:inline-block;width:7px;height:7px;border-radius:4px;background:var(--muted);margin-left:6px;vertical-align:middle;opacity:0;transition:opacity .2s}
.sync.on{opacity:1;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* ---------- API ---------- */
function parseCode(code) {
  try {
    let s = String(code || '').trim().replace(/-/g, '+').replace(/_/g, '/').replace(/\s/g, '');
    while (s.length % 4) s += '=';
    const txt = decodeURIComponent(escape(atob(s)));
    const i = txt.lastIndexOf('|');
    const url = txt.slice(0, i), key = txt.slice(i + 1);
    if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url) || key.length < 24) return null;
    return { url: url, key: key };
  } catch (e) { return null; }
}
async function api(name, ...args) {
  if (!navigator.onLine) throw new Error('Нет интернета. Попробуйте позже.');
  let r;
  try {
    r = await fetch(AUTH.url, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ api: name, key: AUTH.key, args: args }) });
  } catch (e) { throw new Error('Сервер не отвечает. Проверьте интернет.'); }
  let j;
  try { j = await r.json(); } catch (e) { throw new Error('Сервер ответил странно. Проверьте, что развёртывание «бот» обновлено до версии 03.'); }
  if (!j.ok) { if (/Неверный код входа/.test(j.error)) { logout(true); } throw new Error(j.error || 'Ошибка'); }
  return j.data;
}
function setSync(on) { syncing = on; const el = $('#sync'); if (el) el.classList.toggle('on', on); }
async function load(quiet) {
  setSync(true);
  try { const d = await api('getData'); D = d; LS.set('dom.cache', d); render(); }
  catch (e) { if (!quiet || !D) toast(e.message); if (!D) renderError(e.message); }
  finally { setSync(false); }
}
function apply(d, msg) { D = d; LS.set('dom.cache', d); busy = false; closeSheet(); render(); if (msg) toast(msg); }
function fail(e) { busy = false; toast((e && e.message) || 'Ошибка'); document.querySelectorAll('[data-busy]').forEach(b => { b.disabled = false; b.textContent = b.dataset.busy; }); }

}
function logout(silent) { LS.del('dom.auth'); LS.del('dom.cache'); AUTH = null; D = null; closeSheet(); renderLogin(silent ? 'Код входа больше не действует. Попросите новый у владельца.' : ''); }

/* ---------- status helpers ---------- */
function when(v) {
  if (v.type === 'Закупка' && v.buyStatus === 'нужно') return ['Нужно купить', 'p-warn', 'warn'];
  if (v.type === 'Закупка' && v.buyStatus === 'заказано') return ['Заказано', 'p-acc', 'acc'];
  if (v.days === null) return [v.type === 'Срок' ? 'Укажите дату' : v.every ? 'Нет даты' : 'По факту', 'p-mut', 'mut'];
  if (v.snoozed) return ['Отложено до ' + fmt(v.snooze), 'p-mut', 'mut'];
  const d = v.days;
  if (d < 0) return ['Просрочено на ' + (-d) + ' дн.', 'p-neg', 'neg'];
  if (d === 0) return ['Сегодня', 'p-warn', 'warn'];
  if (d === 1) return ['Завтра', 'p-warn', 'warn'];
  if (v.plan && d <= 7) return ['План: ' + fmt(v.next, true), 'p-acc', 'acc'];
  if (d <= 7) return ['Через ' + d + ' ' + plural(d, ['день','дня','дней']), 'p-warn', 'warn'];
  return [fmt(v.next, true), 'p-ok', 'ok'];
}
function elapsed(v) {
  if (v.days === null) return 0;
  if (v.days < 0) return 1;
  const last = pd(v.last), next = pd(v.next);
  if (!last || !next || next <= last) return v.days <= 7 ? .85 : .2;
  return Math.max(0.04, Math.min(1, diff(last, todayD()) / diff(last, next)));
}
function ring(v) {
  const f = elapsed(v), w = when(v), c = 2 * Math.PI * 21;
  const col = w[2] === 'neg' ? 'var(--neg)' : w[2] === 'warn' ? 'var(--warn)' : 'var(--accent)';
  return '<button class="ring" data-act="done" data-id="' + v.id + '" aria-label="Отметить выполнение: ' + esc(v.name) + '">' +
    '<svg width="48" height="48" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="none" stroke="var(--line)" stroke-width="3"/>' +
    '<circle cx="24" cy="24" r="21" fill="none" stroke="' + col + '" stroke-width="3" stroke-linecap="round" stroke-dasharray="' + (c * f).toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 24 24)"/></svg>' +
    '<span class="ck">' + ic('check', 18, 2.2) + '</span></button>';
}

function buildEvents() {

function vToday() {
  const t = todayD();

  const ev = buildEvents();

/* ---------- events ---------- */
function setBusy(btn) { busy = true; if (btn) { btn.disabled = true; btn.textContent = 'Сохраняю…'; } }
function fileToB64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader(); r.onerror = rej;
    r.onload = () => {
      const raw = { name: file.name, mime: file.type || 'application/octet-stream', b64: String(r.result).split(',')[1] };
      if (!/^image\//.test(file.type)) return res(raw);
      const img = new Image(); img.onerror = () => res(raw);
      img.onload = () => { const k = Math.min(1, 1600 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res({ name: file.name.replace(/\.\w+$/, '') + '.jpg', mime: 'image/jpeg', b64: c.toDataURL('image/jpeg', 0.82).split(',')[1] }); };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act === 'ovclose') { if (e.target === b) closeSheet(); return; }
  if (busy && ['snooze','buy','archive','unplan'].indexOf(act) >= 0) return;
  switch (act) {
    case 'tab': tab = id; window.scrollTo(0, 0); render(); break;
    case 'open': openItem(id); break;
    case 'done': openDone(id); break;
    case 'close': closeSheet(); break;
    case 'reload': load(); break;
    case 'logout': if (confirm('Выйти? Чтобы войти снова, понадобится код входа.')) logout(); break;
    case 'evtype': evType = id; render(); break;
    case 'sec': openSec[id] = !openSec[id]; render(); break;
    case 'grp': openGrp[id] = !openGrp[id]; render(); break;
    case 'theme': LS.set('dom.theme', id); applyTheme(); render(); break;
    case 'icon': setIcon(id); break;
    case 'iconpick': $('#iconFile').click(); break;
    case 'cropsave': saveCrop(); break;
    case 'form': if (id) openForm(id); else if (b.dataset.newsec) openForm(null, { section: '', group: '' }); else openForm(null, b.dataset.sec ? { section: b.dataset.sec } : null); break;
    case 'ftype': { const cur = readForm(b.closest('form')); cur.type = id; if (id === 'Срок' && !cur.every) cur.unit = 'год'; renderForm(cur, !!cur.id); break; }
    case 'plan': openPlan(id); break;
    case 'unplan': setBusy(); api('setPlan', id, '').then(d => apply(d, 'План убран')).catch(fail); break;
    case 'snoozemenu': openSnooze(id); break;
    case 'snooze': setBusy(); api('snoozeItem', id, Number(b.dataset.days) || 7, '').then(d => apply(d, 'Отложено')).catch(fail); break;
    case 'buy': setBusy(); api('setBuy', id, b.dataset.s).then(d => { apply(d, 'Статус закупки обновлён'); openItem(id); }).catch(fail); break;
    case 'archive': if (!confirm('Убрать позицию в архив? Её история сохранится.')) return;
      setBusy(); api('saveItem', { id: id, type: item(id).type, name: item(id).name, active: 'нет' }).then(d => apply(d, 'Убрано в архив')).catch(fail); break;
  }
});

/* ---------- custom shortcut icon ---------- */
function setIcon(id) {
  LS.set('dom.icon', id);
  const href = id === 'custom' ? LS.get('dom.iconData', '') : 'icons/icon-180' + (id === 'dusk' ? '' : '-' + id) + '.png';
  document.querySelectorAll('link[rel="apple-touch-icon"]').forEach(l => { l.href = href; });
  render(); toast('Иконка выбрана. Теперь добавьте ярлык заново из Safari.');

let CROP = null;
function drawIcon(ctx, size) {
  const c = CROP, sc = Math.max(size / c.img.width, size / c.img.height) * c.zoom;
  const w = c.img.width * sc, h = c.img.height * sc, mx = (w - size) / 2, my = (h - size) / 2;
  ctx.fillStyle = '#111214'; ctx.fillRect(0, 0, size, size);
  ctx.drawImage(c.img, (size - w) / 2 + c.ox * mx, (size - h) / 2 + c.oy * my, w, h);
}
function drawCrop() { const cv = $('#cropCv'); if (cv && CROP) drawIcon(cv.getContext('2d'), cv.width); }
function openCrop(file) {
  const r = new FileReader();
  r.onload = () => { const img = new Image(); img.onload = () => {
    CROP = { img: img, zoom: 1, ox: 0, oy: 0 };
    sheet(sheetTop('Своя иконка', 'Подвиньте и приблизьте') + '<canvas id="cropCv" class="crop" width="480" height="480" aria-label="Предпросмотр иконки"></canvas>' +
      '<label class="f"><span class="cap">Масштаб</span><input id="cropZoom" type="range" min="1" max="3" step="0.01" value="1"></label>' +
      '<div class="sub" style="margin-top:8px">Двигайте картинку пальцем. iPhone сам скруглит углы.</div>' +
      '<div class="btns"><button class="btn" data-act="cropsave">Сохранить иконку</button></div>');
    drawCrop();
    const cv = $('#cropCv'); let st = null;
    cv.addEventListener('pointerdown', e => { st = { x: e.clientX, y: e.clientY, ox: CROP.ox, oy: CROP.oy }; cv.setPointerCapture(e.pointerId); });
    cv.addEventListener('pointermove', e => { if (!st) return;
      const sc = Math.max(240 / CROP.img.width, 240 / CROP.img.height) * CROP.zoom, mx = (CROP.img.width * sc - 240) / 2, my = (CROP.img.height * sc - 240) / 2;
      CROP.ox = mx ? Math.max(-1, Math.min(1, st.ox + (e.clientX - st.x) / mx)) : 0; CROP.oy = my ? Math.max(-1, Math.min(1, st.oy + (e.clientY - st.y) / my)) : 0; drawCrop(); });
    cv.addEventListener('pointerup', () => { st = null; });
  }; img.onerror = () => toast('Не удалось открыть картинку'); img.src = r.result; };
  r.readAsDataURL(file);
  $('#iconFile').value = '';
}
function saveCrop() {
  const c = document.createElement('canvas'); c.width = c.height = 180;
  drawIcon(c.getContext('2d'), 180);
  LS.set('dom.iconData', c.toDataURL('image/png'));
  CROP = null; closeSheet(); setIcon('custom');
}
document.addEventListener('submit', e => {
  const form = e.target.closest('form[data-form]'); if (!form) return;
  e.preventDefault(); if (busy) return;
  const btn = form.querySelector('[type=submit]'), o = readForm(form), kind = form.dataset.form;
  if (kind === 'login') {
    const a = parseCode(o.code); if (!a) return toast('Код не подходит. Скопируйте его целиком.');
    AUTH = a; setBusy(btn);
    api('getData').then(d => { LS.set('dom.auth', a); busy = false; D = d; LS.set('dom.cache', d); tab = 'today'; render(); toast('Добро пожаловать, ' + d.me.name); })
      .catch(err => { AUTH = null; fail(err); });
  } else if (kind === 'item') {
    const cfg = TF[o.type];
    if (!o.name) return toast('Укажите название'); if (!o.section) return toast('Укажите раздел');
    for (const k of (cfg.req || [])) if (!o[k]) return toast('Заполните поле «' + ((cfg.lab && cfg.lab[k]) || FIELDS[k].l) + '»');
    Object.keys(FIELDS).forEach(k => { if (cfg.f.indexOf(k) < 0 && ['section','group','name'].indexOf(k) < 0) delete o[k]; });
    setBusy(btn); api('saveItem', o).then(d => apply(d, 'Сохранено')).catch(fail);
  } else if (kind === 'plan') {
    setBusy(btn); api('setPlan', form.dataset.id, o.plan).then(d => apply(d, 'Запланировано на ' + fmt(o.plan, true))).catch(fail);
  } else if (kind === 'snooze') {
    setBusy(btn); api('snoozeItem', form.dataset.id, 0, o.until).then(d => apply(d, 'Отложено до ' + fmt(o.until, true))).catch(fail);
  } else if (kind === 'done') {
    const files = Array.prototype.slice.call(form.querySelector('[name=files]').files || []);
    setBusy(btn);
    files.reduce((p, f) => p.then(urls => fileToB64(f).then(x => api('uploadReceipt', x.name, x.mime, x.b64)).then(u => urls.concat([u]))), Promise.resolve([]))
      .then(urls => { o.files = urls; return api('markDone', form.dataset.id, o); }).then(d => apply(d, 'Записано')).catch(fail);
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#layer').innerHTML) closeSheet(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && AUTH && D && !$('#layer').innerHTML) load(true); });

/* ---------- start ---------- */
AUTH = LS.get('dom.auth', null);
if (!AUTH) renderLogin('');
else {
  D = LS.get('dom.cache', null);
  if (D) render();
  load(!!D);
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
